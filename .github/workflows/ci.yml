name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: testnet
      BIGISH_YER_URL: https://example.com
      CORS_ORIGIN: '*'
      HEALTH_TIMEOUT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run security tests
        run: npm run test:security

      - name: Run integration tests
        run: npm run test:integration

      - name: Check whitespace errors
        run: git diff --check

      - name: Verify server starts
        run: |
          npm start &
          sleep 2
          curl -f http://localhost:3314/api/health || exit 1
          kill %1