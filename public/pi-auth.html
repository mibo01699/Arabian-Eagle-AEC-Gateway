<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#0a0e27">
  <meta name="description" content="Arabian Eagle AEC Gateway - Pi Network Authentication">
  <title>🦅 AEC Gateway - Pi Auth</title>
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/pi.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <span class="logo-icon">🦅</span>
        <span class="brand-text" data-i18n="app.name">AEC Gateway</span>
      </div>
      <div class="nav-actions">
        <a href="/" class="nav-btn" title="الرئيسية">
          <i class="fas fa-home"></i>
        </a>
        <button class="nav-btn" id="langToggle" aria-label="تبديل اللغة">
          <i class="fas fa-globe"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-content pi-page">
    <header class="page-header">
      <h1>🔐 مصادقة Pi Network</h1>
      <p class="subtitle">قم بتسجيل الدخول باستخدام حساب Pi Network الخاص بك</p>
    </header>

    <div class="pi-container" id="piContainer">
      <!-- حالة المصادقة -->
      <div class="auth-status" id="authStatus">
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot offline"></span>
          <span class="status-label">❌ غير مصادق</span>
        </div>
      </div>

      <!-- زر المصادقة -->
      <div class="auth-actions">
        <button id="loginButton" class="pi-btn primary">
          <i class="fas fa-sign-in-alt"></i> تسجيل الدخول عبر Pi Network
        </button>
        <button id="logoutButton" class="pi-btn secondary" style="display:none;">
          <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </button>
      </div>

      <!-- معلومات المستخدم -->
      <div class="user-info" id="userInfo" style="display:none;">
        <h3>👤 معلومات المستخدم</h3>
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">اسم المستخدم</span>
            <span class="info-value" id="username">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">عنوان المحفظة</span>
            <span class="info-value" id="walletAddress">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">الرصيد</span>
            <span class="info-value" id="balance">-</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="page-footer">
    <p>© 2026 <strong>Arabian Eagle Tech</strong> — جميع الحقوق محفوظة</p>
    <p class="footer-version">الإصدار 1.0.0</p>
  </footer>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  
  <!-- JavaScript -->
  <script src="/js/i18n.js"></script>
  <script src="/js/pi-sdk.js"></script>
</body>
</html>
