<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#0a0e27">
  <meta name="description" content="Arabian Eagle AEC Gateway - Pi Network Authentication">
  <title>🦅 AEC Gateway - Pi Auth</title>
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/pi.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <span class="logo-icon">🦅</span>
        <span class="brand-text" data-i18n="app.name">AEC Gateway</span>
      </div>
      <div class="nav-actions">
        <a href="/" class="nav-btn" title="لوحة التحكم" data-i18n-tooltip="nav.dashboard">
          <i class="fas fa-home"></i>
        </a>
        <button class="nav-btn" id="langToggle" aria-label="تبديل اللغة" data-i18n-tooltip="buttons.language">
          <i class="fas fa-globe"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-content pi-page">
    <header class="page-header">
      <h1 data-i18n="pi.title">🔐 مصادقة Pi Network</h1>
      <p class="subtitle" data-i18n="pi.subtitle">قم بتسجيل الدخول باستخدام حساب Pi Network الخاص بك</p>
    </header>

    <div class="pi-container" id="piContainer">
      <!-- حالة المصادقة -->
      <div class="auth-status" id="authStatus">
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot offline"></span>
          <span class="status-label" data-i18n="pi.status.unauthenticated">❌ غير مصادق</span>
        </div>
      </div>

      <!-- زر المصادقة -->
      <div class="auth-actions">
        <button id="loginButton" class="pi-btn primary" data-i18n="pi.loginButton">
          <i class="fas fa-sign-in-alt"></i> تسجيل الدخول عبر Pi Network
        </button>
        <button id="logoutButton" class="pi-btn secondary" style="display:none;" data-i18n="pi.logoutButton">
          <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </button>
      </div>

      <!-- معلومات المستخدم -->
      <div class="user-info" id="userInfo" style="display:none;">
        <h3 data-i18n="pi.userInfo">👤 معلومات المستخدم</h3>
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label" data-i18n="pi.username">اسم المستخدم</span>
            <span class="info-value" id="username">-</span>
          </div>
          <div class="info-item">
            <span class="info-label" data-i18n="pi.walletAddress">عنوان المحفظة</span>
            <span class="info-value" id="walletAddress">-</span>
          </div>
          <div class="info-item">
            <span class="info-label" data-i18n="pi.balance">الرصيد</span>
            <span class="info-value" id="balance">-</span>
          </div>
        </div>
      </div>

      <!-- نموذج الدفع -->
      <div class="payment-section" id="paymentSection" style="display:none;">
        <h3 data-i18n="pi.paymentTitle">💳 تأكيد الدفع</h3>
        <form id="paymentForm">
          <div class="form-group">
            <label data-i18n="pi.paymentAmount">المبلغ (π)</label>
            <input type="number" id="paymentAmount" step="0.01" min="0.01" required>
          </div>
          <div class="form-group">
            <label data-i18n="pi.paymentDescription">الوصف</label>
            <input type="text" id="paymentDescription" placeholder="وصف المعاملة">
          </div>
          <div class="form-group">
            <label data-i18n="pi.paymentMemo">المذكرة</label>
            <input type="text" id="paymentMemo" placeholder="مذكرة اختيارية">
          </div>
          <div class="payment-actions">
            <button type="submit" class="pi-btn success" data-i18n="pi.confirmPayment">
              <i class="fas fa-check"></i> تأكيد الدفع
            </button>
            <button type="button" class="pi-btn danger" id="cancelPayment" data-i18n="pi.cancelPayment">
              <i class="fas fa-times"></i> إلغاء
            </button>
          </div>
        </form>
      </div>

      <!-- سجل المعاملات -->
      <div class="transaction-history" id="transactionHistory" style="display:none;">
        <h3>📜 سجل المعاملات</h3>
        <div id="transactionList">
          <p style="color: var(--text-muted);">لا توجد معاملات بعد</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="page-footer">
    <p>© 2026 <strong>Arabian Eagle Tech</strong> — <span data-i18n="app.footer">جميع الحقوق محفوظة</span></p>
    <p class="footer-version"><span data-i18n="app.version">الإصدار</span> 1.0.0</p>
  </footer>

  <!-- Pi SDK (يتم تحميله من موقع Pi Network الرسمي) -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  
  <script src="/js/i18n.js"></script>
  <script src="/js/pi-sdk.js"></script>
</body>
</html>
